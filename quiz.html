<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyGain | JEE Maths Quiz</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7ff;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  color:white;

  padding:30px 18px;
}

header h1{

}

header p{

  text-decoration:none;

.question{

.option:hover{
  background:#dbeafe;

  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.result{
  margin-top:12px;
  font-weight:bold;
}
