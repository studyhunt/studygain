<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyGain | JEE Maths Quiz</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7ff;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  color:white;
  text-align:center;
  padding:28px 15px;
}

.container{
  max-width:750px;
  margin:auto;
  padding:20px 15px;
}

.back{
  color:#2563eb;
  text-decoration:none;
  font-weight:bold;
}

.card{
  background:white;
  margin-top:20px;
  padding:20px;
  border-radius:15px;
  box-shadow:0 4px 15px #0001;
}

.question{
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}

label{
  display:block;
  background:#eef4ff;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
}

button{
  border:0;
  background:#2563eb;
  color:white;
  padding:13px 20px;
  border-radius:9px;
  font-weight:bold;
  font-size:16px;
  margin-top:20px;
}

.result{
  margin-top:10px;
  font-weight:bold;
}

#score{
  text-align:center;
  margin-top:20px;
  padding:20px;
  background:#111827;
  color:white;
  border-radius:12px;
  display:none;
}

footer{
  margin-top:30px;
  padding:22px;
  background:#172033;
  color:white;
  text-align:center;
}
</style>
</head>

<body>

<header>
<h1>📝 StudyGain Quiz</h1>
<p>JEE Maths Practice</p>
</header>

<div class="container">

<a class="back" href="index.html">← Back to StudyGain</a>

<div class="card">
<div class="question">
1. If x² − 5x + 6 = 0, the roots are:
</div>

<label><input type="radio" name="q1" value="A"> A) 1 and 6</label>
<label><input type="radio" name="q1" value="B"> B) 2 and 3</label>
<label><input type="radio" name="q1" value="C"> C) −2 and −3</label>
<label><input type="radio" name="q1" value="D"> D) 3 and 4</label>

<div id="r1" class="result"></div>
</div>


<div class="card">
<div class="question">
2. What is sin²θ + cos²θ?
</div>

<label><input type="radio" name="q2" value="A"> A) 0</label>
<label><input type="radio" name="q2" value="B"> B) 1</label>
<label><input type="radio" name="q2" value="C"> C) 2</label>
<label><input type="radio" name="q2" value="D"> D) −1</label>

<div id="r2" class="result"></div>
</div>


<div class="card">
<div class="question">
3. What is the derivative of x²?
</div>

<label><input type="radio" name="q3" value="A"> A) x</label>
<label><input type="radio" name="q3" value="B"> B) 2x</label>
<label><input type="radio" name="q3" value="C"> C) x²</label>
<label><input type="radio" name="q3" value="D"> D) 2</label>

<div id="r3" class="result"></div>
</div>


<div class="card">
<div class="question">
4. If a = 2 and b = 3, then a² + b² = ?
</div>

<label><input type="radio" name="q4" value="A"> A) 5</label>
<label><input type="radio" name="q4" value="B"> B) 10</label>
<label><input type="radio" name="q4" value="C"> C) 13</label>
<label><input type="radio" name="q4" value="D"> D) 12</label>

<div id="r4" class="result"></div>
</div>


<div class="card">
<div class="question">
5. What is ∫1 dx?
</div>

<label><input type="radio" name="q5" value="A"> A) 1</label>
<label><input type="radio" name="q5" value="B"> B) x + C</label>
<label><input type="radio" name="q5" value="C"> C) x² + C</label>
<label><input type="radio" name="q5" value="D"> D) 0</label>

<div id="r5" class="result"></div>
</div>


<button onclick="checkQuiz()">Check Answers</button>

<div id="score"></div>

</div>

<footer>
<strong>🎯 StudyGain</strong><br>
Free JEE learning resources.
</footer>


<script>

function checkQuiz(){

let score=0;

let answers={
q1:"B",
q2:"B",
q3:"B",
q4:"C",
q5:"B"
};

for(let i=1;i<=5;i++){

let selected=document.querySelector(
'input[name="q'+i+'"]:checked'
);

let result=document.getElementById("r"+i);

if(selected && selected.value===answers["q"+i]){
score++;
result.innerHTML="✅ Correct!";
result.style.color="green";
}else{
result.innerHTML="❌ Try again. Correct answer: "+
answers["q"+i];
result.style.color="red";
}

}

let scoreBox=document.getElementById("score");

scoreBox.style.display="block";

scoreBox.innerHTML=
"🎯 Your Score: "+score+" / 5";

}

</script>

</body>
</html>
