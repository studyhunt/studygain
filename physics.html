<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyGain | JEE Physics</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7ff;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#0f766e,#06b6d4);
  color:white;
  text-align:center;
  padding:30px 18px;
}

header h1{
  margin:0;
  font-size:32px;
}

header p{
  margin-top:7px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:25px 18px;
}

.back{
  color:#0f766e;
  text-decoration:none;
  font-weight:bold;
}

.title{
  text-align:center;
  margin:25px 0;
}

.title h2{
  font-size:28px;
}

.title p{
  color:#666;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:white;
  padding:22px 18px;
  border-radius:18px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.card h3{
  color:#0f766e;
  margin-top:0;
}

.card p{
  color:#666;
  font-size:14px;
}

.formula{
  background:#ecfeff;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
  font-family:Georgia,serif;
}

footer{
  margin-top:30px;
  background:#172033;
  color:white;
  text-align:center;
  padding:22px;
}

footer small{
  color:#cbd5e1;
}
</
