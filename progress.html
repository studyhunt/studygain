<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyGain | Study Progress</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7ff;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#059669,#14b8a6);
  color:white;
  text-align:center;
  padding:30px 15px;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px 15px;
}

.back{
  color:#059669;
  font-weight:bold;
  text-decoration:none;
}

.card{
  background:white;
  padding:20px;
  margin-top:18px;
  border-radius:15px;
  box-shadow:0 4px 12px #0001;
}

.card h2{
  color:#059669;
}

.bar{
  width:100%;
  height:18px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:#10b981;
  border-radius:20px;
}

.percent{
  text-align:right;
  font-weight:bold;
  margin-top:6px;
}
</style>
</head>

<body>

<header>
<h1>📊 StudyGain Progress</h1>
<p>Apni study progress track karo</p>
</header>

<div class="container">

<p>
<a class="back" href="index.html">← Back to StudyGain</a>
</p>

<div class="card">
<h2>📐 Mathematics</h2>
<p>Topics completed</p>

<div class="bar">
<div class="fill" style="width:40%;"></div>
</div>

<div class="percent">40%</div>
</div>


<div class="card">
<h2>⚡ Physics</h2>
<p>Topics completed</p>

<div class="bar">
<div class="fill" style="width:25%;"></div>
</div>

<div class="percent">25%</div>
</div>


<div class="card">
<h2>🧪 Chemistry</h2>
<p>Topics completed</p>

<div class="bar">
<div class="fill" style="width:30%;"></div>
</div>

<div class="percent">30%</div>
</div>


<div class="card">
<h2>🎯 Overall Progress</h2>
<p>Current study progress</p>

<div class="bar">
<div class="fill" style="width:32%;"></div>
</div>

<div class="percent">32%</div>
</div>

</div>

</body>
</html>
