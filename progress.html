<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyGain | Progress Tracker</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7ff;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#059669,#14b8a6);
  color:white;
  text-align:center;
  padding:30px 15px;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px 15px;
}

.back{
  color:#059669;
  font-weight:bold;
  text-decoration:none;
}

.card{
  background:white;
  padding:20px;
  margin-top:18px;
  border-radius:15px;
  box-shadow:0 4px 12px #0001;
}

.card h2{
  color:#059669;
}

.topic{
  display:block;
  background:#f0fdf4;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
}

.topic input{
  margin-right:10px;
}

.progress-box{
  margin-top:25px;
}

.bar{
  width:100%;
  height:20px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  background:#10b981;
  border-radius:20px;
  transition:width .3s;
}

.percent{
  text-align:center;
  font-weight:bold;
  margin-top:8px;
}

button{
  width:100%;
  margin-top:20px;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#059669;
  color:white;
  font-size:16px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>📊 StudyGain Progress</h1>
<p>Apne completed topics track karo</p>
</header>

<div class="container">

<p>
<a class="back" href="index.html">← Back to StudyGain</a>
</p>

<div class="card">

<h2>📐 Mathematics</h2>

<label class="topic">
<input type="checkbox" class="subject" value="maths">
Algebra
</label>

<label class="topic">
<input type="checkbox" class="subject" value="maths">
Trigonometry
</label>

<label class="topic">
<input type="checkbox" class="subject" value="maths">
Calculus
</label>

<label class="topic">
<input type="checkbox" class="subject" value="maths">
Coordinate Geometry
</label>

</div>


<div class="card">

<h2>⚡ Physics</h2>

<label class="topic">
<input type="checkbox" class="subject" value="physics">
Kinematics
</label>

<label class="topic">
<input type="checkbox" class="subject" value="physics">
Laws of Motion
</label>

<label class="topic">
<input type="checkbox" class="subject" value="physics">
Work & Energy
</label>

<label class="topic">
<input type="checkbox" class="subject" value="physics">
Gravitation
</label>

</div>


<div class="card">

<h2>🧪 Chemistry</h2>

<label class="topic">
<input type="checkbox" class="subject" value="chemistry">
Physical Chemistry
</label>

<label class="topic">
<input type="checkbox" class="subject" value="chemistry">
Organic Chemistry
</label>

<label class="topic">
<input type="checkbox" class="subject" value="chemistry">
Inorganic Chemistry
</label>

<label class="topic">
<input type="checkbox" class="subject" value="chemistry">
Atomic Structure
</label>

</div>


<div class="card progress-box">

<h2>🎯 Overall Progress</h2>

<div class="bar">
<div class="fill" id="progressFill"></div>
</div>

<div class="percent" id="progressText">
0% Complete
</div>

<button onclick="resetProgress()">
Reset Progress
</button>

</div>

</div>


<script>

const boxes =
document.querySelectorAll(".subject");

function updateProgress(){

let completed = 0;

boxes.forEach(function(box){

if(box.checked){
completed++;
}

});

let total = boxes.length;

let percent =
Math.round((completed / total) * 100);

document.getElementById("progressFill")
.style.width = percent + "%";

document.getElementById("progressText")
.innerHTML =
percent + "% Complete";

}

boxes.forEach(function(box){

box.addEventListener("change", updateProgress);

});

function resetProgress(){

boxes.forEach(function(box){
box.checked = false;
});

updateProgress();

}

</script>

</body>
</html>
